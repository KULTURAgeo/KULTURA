name: Resolve Motion preview lockfile
on:
  push:
    branches: [preview/motion-react-ui-20261018]
permissions:
  contents: write
jobs:
  verified-lock:
    if: github.event.head_commit.message != 'chore(preview): resolve Motion lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Resolve pinned Motion dependencies from npm registry
        run: corepack pnpm install --lockfile-only --no-frozen-lockfile
      - name: Validate frozen install and integrity
        run: corepack pnpm install --frozen-lockfile
      - name: Commit verified dependency hashes on preview branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(preview): resolve Motion lockfile"
          git push origin HEAD:preview/motion-react-ui-20261018
