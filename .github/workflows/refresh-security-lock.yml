name: Temporary lockfile refresh for security patch

on:
  push:
    branches:
      - audit/master-hardening-20261012
    paths:
      - .github/workflows/refresh-security-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-security-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: corepack enable
      - name: Resolve exact reviewed dependency versions without lifecycle scripts
        run: corepack pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit lockfile only
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
            exit 0
          fi
          git commit -m 'chore: regenerate lockfile for patched Next.js and React'
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
