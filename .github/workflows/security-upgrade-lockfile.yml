name: Security dependency lockfile refresh

on:
  push:
    branches:
      - security-hardening-2026-10-06

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-hardening-2026-10-06
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - name: Upgrade patched Next.js packages
        run: |
          corepack pnpm up next@16.3.8 eslint-config-next@16.3.8 --save-exact
          corepack pnpm install --frozen-lockfile
          corepack pnpm audit --audit-level=high
          corepack pnpm exec next typegen
          corepack pnpm check
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Upgrade Next.js security patch to 16.3.8"
          git push origin HEAD:security-hardening-2026-10-06
